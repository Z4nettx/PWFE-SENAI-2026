<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberSenai - Tentativas de Acesso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="d-flex vh-100 align-items-center">
    <form action=""
        class="d-flex flex-column border border-dark border-1 container-fluid col-5 h-75 p-4 gap-3 justify-content-around rounded-5">
        <h1 class="text-center">Faça Login</h1>
        <fieldset class="d-flex flex-column">
            <label for="email" class="form-text">Email:</label>
            <input type="email" class="form-control" name="email" id="email">
            <label for="senha" class="form-text">Senha:</label>
            <input type="password" class="form-control" name="senha" id="senha">
            <button type="submit" id="submit" class="btn btn-primary">Enviar</button>
        </fieldset>
        <div id="resultado"></div>
    </form>
</body>
<script type="module" src="script.js"></script>

</html>
