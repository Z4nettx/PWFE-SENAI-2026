<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <button>Gerar tabuadas</button>
        <section id="resultado"></section>
    </main>
    
    <script>
        const button = document.querySelector("button");
        const output = document.querySelector("section")
        let resultado = '';
        

        button.addEventListener("click", ()=> {
            if (output.innerHTML == '') {
            for (let tabuada = 1; tabuada <= 4399; tabuada++) {
                resultado += `<div><h2>Tabuada do ${tabuada}</h2>`;
                for (let multi = 1; multi <= 4399; multi++) {
                    let operacao = tabuada * multi;
                    resultado += `<p> ${tabuada}x${multi} = ${operacao}</p>`;
                    
                }
                resultado += `</div>`;
            }
            output.innerHTML = resultado
        } else {
            alert("Voce já exibiu todas as tabuadas");
            
        }
})
        
    </script>
</body>
</html>
