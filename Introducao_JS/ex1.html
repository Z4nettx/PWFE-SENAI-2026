<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introdução JavaScript</title>
</head>
<body>
    <h1></h1>
    <h2></h2>
</body>
<script>
    const data = new Date();
    const h1 = document.querySelector('h1');
    const h2 = document.querySelector('h2');

    h1.innerHTML = '<strong> Olá Mago</strong>';
    h2.innerHTML = `<em> ${data}</em>`;
    

    const nome = window.prompt('Seu nome: ' , 'Digite seu nome aqui');
    
    alert('Seu nome é ' + nome);
</script>
</html>
