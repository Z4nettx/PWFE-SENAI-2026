<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <img src="" alt="">
        <h1>Gerador de Personagem de RPG</h1>
        <div></div>
    </header>
    <main>
        <section>
            <form action="" method="post">
                
                <div class="row">
                    <div>
                        <label for="nome">Nome do Personagem:</label>
                        <input type="text" name="nome" id="nome">
                    </div>
                    <div>
                        <label for="classe">Classe do Personagem:</label>
                        <select name="classe" id="classe">
                            <option id="rere" selected disabled>Selecione uma opção</option>
                            <option value="Combatente">Combatente</option>
                            <option value="Ocultista">Ocultista</option>
                            <option value="Especialista">Especialista</option>
                        </select>
                    </div>
                </div>
                
                <div class="row2">
                    <label for="skill">Habilidade Principal do Personagem:</label>
                    <textarea name="skill" id="skill" cols="30" rows="5"></textarea>
                </div>

                <button id="gerarP" type="submit">Gerar Personagem</button>
                <button type="reset">Limpar Campos</button>
            </form>
        </section>
        <section id="result"></section>
    </main>
</body>
<script src="script.js"></script>
</html>
