<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechSoluções - Meritocracia</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>TechSoluções</h1>
    </header>
    <main>
        
        <aside>
            <h2>Meritocracia e Reajuste Salarial</h2>
            <h3>Informações do colaborador:</h3>
            <form action="" id="form">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" placeholder="Nome do colaborador" required>

                <select name="" id="cargo" required>
                    <option value="" selected disabled>Selecione uma opção</option>
                    <option value="aprendiz">Aprendiz</option>
                    <option value="analista">Analista de TI</option>
                    <option value="gerente">Gerente de TI</option>
                    <option value="diretor">Diretor de TI</option>
                </select>
                <label for="salario">Salário:</label>
                <input type="number" id="salario" placeholder="Salário do colaborador" required>

                <label for="faltas">Faltas:</label>
                <input type="number" name="" id="faltas" placeholder="Faltas do colaborador" required>

                <label for="atrasos">Atrasos:</label>
                <input type="number" name="" id="atrasos" placeholder="Atrasos do colaborador" required>


                <button type="submit" id="enviar">Enviar</button>
            </form>
        </aside>
        <section id="resultado">
            
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
